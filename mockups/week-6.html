<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Next 6 days mock-up</title>
    <link rel="stylesheet" href="../public/styles.css" />
    <style>
      body { display: block; padding: 24px 16px 40px; background: #e8e8ed; }
      .board { max-width: 920px; margin: 0 auto 16px; }
      .board h1 { font-size: 24px; letter-spacing: -0.4px; }
      .board p { margin-top: 8px; color: #6e6e73; font-size: 15px; line-height: 1.4; }
      .gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 24px; }
      .phone { min-height: auto; padding-bottom: 18px; }
      .details, .toast, .alert-banner, .week-toggle { display: none; }
      .hero-temp .temp-value, .hero-temp #temp { font-size: 58px; }
      .condition { font-size: 22px; }
      .week { margin-top: 16px; }
      .day-strip.six-row { grid-template-columns: repeat(6, 1fr); }
      .day-strip.six-grid { grid-template-columns: repeat(3, 1fr); }
      .caption {
        text-align: center;
        margin-top: 12px;
        color: #6e6e73;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.4px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="board">
      <h1>Next 6 days · NWS only</h1>
      <p>Sunday–Friday from the National Weather Service. No Open-Meteo extra day. Not live.</p>
    </div>
    <div class="gallery" id="gallery"></div>
    <script>
      const ICONS = {
        sun: `<svg viewBox="0 0 36 32" fill="none"><circle cx="18" cy="16" r="6" stroke="#ff9500" stroke-width="1.6"/><path d="M18 5v3M18 24v3M7 16h3M26 16h3M10 8.5l2 2M24 21.5l2 2M26 8.5l-2 2M12 21.5l-2 2" stroke="#ff9500" stroke-width="1.5" stroke-linecap="round"/></svg>`,
        storm: `<svg viewBox="0 0 36 32" fill="none"><path d="M9 15c0-4 3-6.5 7-6.5 3 0 5.2 1.6 6.2 4 3.2.2 5.6 2.3 5.6 5.2S25.4 23 22.2 23H11.4C8 23 6 20.6 6 17.8c0-2.6 1.8-4.8 3-5.4" stroke="currentColor" stroke-width="1.6"/><path d="M16 21.5 13 27h4l-2 5 6-7h-4l2-3.5h-3Z" fill="#ffd60a"/></svg>`,
        rain: `<svg viewBox="0 0 36 32" fill="none"><path d="M9 14c0-4 3-6.5 7-6.5 3 0 5.2 1.6 6.2 4 3.2.2 5.6 2.3 5.6 5.2S25.4 22 22.2 22H11.4C8 22 6 19.6 6 16.8c0-2.6 1.8-4.8 3-5.4" stroke="currentColor" stroke-width="1.6"/><path d="M12 24.5 10.5 28M18 24.5 16.5 28M24 24.5 22.5 28" stroke="#4da3ff" stroke-width="1.6" stroke-linecap="round"/></svg>`,
      };
      const DAYS = [
        { name: "Sun", date: "8/16", hi: 84, lo: 73, icon: ICONS.storm },
        { name: "Mon", date: "8/17", hi: 90, lo: 71, icon: ICONS.rain },
        { name: "Tue", date: "8/18", hi: 88, lo: 68, icon: ICONS.sun },
        { name: "Wed", date: "8/19", hi: 88, lo: 72, icon: ICONS.sun },
        { name: "Thu", date: "8/20", hi: 89, lo: 68, icon: ICONS.storm },
        { name: "Fri", date: "8/21", hi: 84, lo: 67, icon: ICONS.rain },
      ];

      function cards() {
        return DAYS.map(
          (day) => `<button class="day-card" type="button">
            <div class="name">${day.name}</div>
            <div class="date">${day.date}</div>
            <div class="wx-icon">${day.icon}</div>
            <div class="hi">${day.hi}°</div>
            <div class="lo">${day.lo}°</div>
          </button>`
        ).join("");
      }

      function phone(stripClass, caption) {
        return `<div>
          <div class="phone">
            <header class="top-bar">
              <div class="house-switch">
                <button class="icon-btn" type="button" aria-selected="true" tabindex="-1">
                  <svg viewBox="0 0 24 24"><path d="M4.2 11.2 12 4.4l7.8 6.8M6.6 10.4V19h10.8v-8.6M10.3 19v-4.6h3.4V19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <button class="icon-btn" type="button" aria-selected="false" tabindex="-1">
                  <svg viewBox="0 0 24 24"><path d="M12.4 13.2V5.6M12.4 5.6c2.8 0 6.2 1.6 6.2 3.6 0 1.1-1.6 1.6-3.2 1.4M12.4 5.6C9.6 5.6 6.2 7.2 6.2 9.2c0 1.1 1.6 1.6 3.2 1.4M4 17.2c1.4-1 2.8-1 4.2 0s2.8 1 4.2 0 2.8-1 4.2 0 2.8 1 4.2 0M4 20.2c1.4-1 2.8-1 4.2 0s2.8 1 4.2 0 2.8-1 4.2 0 2.8 1 4.2 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                </button>
              </div>
              <h1>Today’s Weather Conditions</h1>
              <div class="top-actions"><span class="icon-btn" style="color: var(--blue)">☼</span></div>
            </header>
            <section class="now">
              <p class="kicker">Right now</p>
              <div class="hero">
                <div class="hero-icon" style="color: var(--icon)">
                  <svg viewBox="0 0 78 64" fill="none"><circle cx="39" cy="32" r="13" stroke="#ff9500" stroke-width="2.4"/></svg>
                </div>
                <div class="hero-temp"><span class="temp-value">85</span><span class="degree">°</span></div>
              </div>
              <p class="feels">Feels like 91°</p>
              <h2 class="condition">Sunny</h2>
              <p class="place">Home</p>
            </section>
            <section class="tonight">
              <p class="kicker">Today’s forecast</p>
              <div class="forecast-card">
                <div class="forecast-head">
                  <div>
                    <p class="forecast-name">Today</p>
                    <p class="forecast-short">Sunny, high near 88</p>
                  </div>
                  <p class="forecast-temp">88°</p>
                </div>
              </div>
            </section>
            <section class="week">
              <p class="kicker">Next 6 days</p>
              <div class="day-strip ${stripClass}">${cards()}</div>
            </section>
          </div>
          <p class="caption">${caption}</p>
        </div>`;
      }

      document.getElementById("gallery").innerHTML =
        phone("six-row", "A · one row of 6") + phone("six-grid", "B · two rows of 3");
    </script>
  </body>
</html>
