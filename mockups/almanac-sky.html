<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Almanac sky mock-up · tiles</title>
    <link rel="stylesheet" href="../public/styles.css" />
    <style>
      body { display: block; padding: 24px 16px 48px; background: #111; }
      .board { max-width: 920px; margin: 0 auto 16px; }
      .board h1 { font-size: 24px; letter-spacing: -0.4px; color: #f2f2f7; }
      .board p { margin-top: 8px; color: #aeaeb2; font-size: 15px; line-height: 1.45; }
      .gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 28px; }
      .phone { min-height: auto; padding-bottom: 18px; color: var(--text); }
      .toast, .alert-banner, .week { display: none; }
      .hero-temp .temp-value { font-size: 58px; }
      .condition { font-size: 22px; }
      .caption {
        text-align: center;
        margin-top: 12px;
        color: #aeaeb2;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.4px;
        text-transform: uppercase;
      }

      .phone.proposed {
        --text: #ffffff;
        --muted: #d1d1d6;
        --forecast-text: #e5e5ea;
        --icon: #e5e5ea;
        --unit: #d1d1d6;
      }

      .phone[data-theme="dark"] .panel-switch {
        background: #2c2c2e;
      }
      .phone[data-theme="dark"] .panel-switch button {
        color: #aeaeb2;
      }
      .phone[data-theme="dark"] .panel-switch button[aria-selected="true"] {
        background: #4a4a4e;
        color: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      }

      .sky-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px 10px;
        margin: 4px 0 2px;
      }
      .sky-tile {
        display: grid;
        grid-template-columns: 28px 1fr;
        column-gap: 8px;
        align-items: center;
        min-height: 52px;
        padding: 4px 2px;
      }
      .sky-tile + .sky-tile:nth-child(n + 3) {
        border-top: 1px solid color-mix(in srgb, var(--text) 6%, transparent);
      }
      .sky-tile svg { width: 26px; height: 26px; display: block; }
      .sky-tile .label span { font-size: 13px; }
      .sky-tile .value {
        justify-self: start;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.2px;
      }
      .almanac-group-sub {
        margin: 1px 0 0;
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.2px;
      }
      .moon-unlit { fill: #3a3a3c; }
      .phone.proposed .moon-unlit { fill: #111; }
      .moon-lit { fill: #f2f2f7; }
      .moon-rim { fill: none; stroke: #c7c7cc; stroke-width: 0.7; }
      .phone.proposed .moon-rim { stroke: #e5e5ea; }
      .moon-full { fill: #fff; stroke: #c7c7cc; stroke-width: 0.8; }
      .phone.proposed .moon-full { fill: #f2f2f7; stroke: #e5e5ea; }
      .phase-key {
        max-width: 920px;
        margin: 28px auto 0;
        padding: 16px 18px;
        background: #1c1c1e;
        border-radius: 16px;
        color: #d1d1d6;
      }
      .phase-key h2 {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: #d1d1d6;
      }
      .phase-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 10px 6px;
        margin-top: 14px;
      }
      .phase {
        flex: 1 1 64px;
        min-width: 56px;
        text-align: center;
        color: #d1d1d6;
        font-size: 11px;
        line-height: 1.3;
      }
      .phase svg {
        width: 28px;
        height: 28px;
        display: block;
        margin: 0 auto 6px;
      }
      .note {
        max-width: 920px;
        margin: 16px auto 0;
        color: #aeaeb2;
        font-size: 13px;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <div class="board">
      <h1>Almanac · tiles + phase set</h1>
      <p>
        Record years sit on the label line: Low (1964). The 1991–2020 range sits under Normals.
      </p>
    </div>

    <div class="gallery" id="gallery"></div>
    <div class="phase-key">
      <h2>Phase icons</h2>
      <div class="phase-row" id="phases"></div>
    </div>
    <p class="note">Mock only. Dark phone uses the B type treatment. 5% is optically closer to ~9% so the sliver stays visible.</p>

    <script>
      function moonSvg(pct) {
        if (pct >= 100) {
          return `<svg viewBox="0 0 24 24" aria-hidden="true"><circle class="moon-full" cx="12" cy="12" r="7.1"/></svg>`;
        }
        const r = 7.1;
        const i = pct === 5 ? 0.09 : pct / 100;
        if (pct === 50) {
          return `<svg viewBox="0 0 24 24" aria-hidden="true">
            <circle class="moon-unlit" cx="12" cy="12" r="7.1"/>
            <path class="moon-lit" d="M12 4.9A7.1 7.1 0 0 1 12 19.1Z"/>
            <circle class="moon-rim" cx="12" cy="12" r="7.1"/>
          </svg>`;
        }
        const rx = (Math.abs(1 - 2 * i) * r).toFixed(2);
        const sweep = i <= 0.5 ? 0 : 1;
        return `<svg viewBox="0 0 24 24" aria-hidden="true">
          <circle class="moon-unlit" cx="12" cy="12" r="7.1"/>
          <path class="moon-lit" d="M12 4.9A7.1 7.1 0 0 1 12 19.1A${rx} 7.1 0 0 ${sweep} 12 4.9Z"/>
          <circle class="moon-rim" cx="12" cy="12" r="7.1"/>
        </svg>`;
      }

      const sunUp = `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 16.5h16" stroke="#ff9f0a" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M12 16.5a5 5 0 1 1 5-5" stroke="#ff9f0a" stroke-width="1.6"/>
        <path d="M12 6.2V4.4M18.4 9.2l1.3-1.3M5.6 9.2 4.3 7.9" stroke="#ff9f0a" stroke-width="1.5" stroke-linecap="round"/>
      </svg>`;
      const sunDown = `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 16.5h16" stroke="#ff9f0a" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M7 16.5a5 5 0 0 1 10 0" stroke="#ff9f0a" stroke-width="1.6"/>
        <path d="M12 8.2V6.6M18.2 11l1.2-1.2M5.8 11 4.6 9.8" stroke="#ff9f0a" stroke-width="1.5" stroke-linecap="round"/>
      </svg>`;
      const hiIcon = `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 17.2V7.2M8.2 11 12 7.2 15.8 11" stroke="#ff9f0a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;
      const loIcon = `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 6.8v10M8.2 13 12 16.8 15.8 13" stroke="#4da3ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;

      function tile(icon, label, sub, value) {
        const small = sub ? `<small>${sub}</small>` : "";
        return `<div class="sky-tile">${icon}<div><div class="label stacked"><span>${label}</span>${small}</div><div class="value">${value}</div></div></div>`;
      }

      function phone(theme, cls, caption) {
        return `<div>
          <div class="phone ${cls}" data-theme="${theme}">
            <header class="top-bar">
              <div class="house-switch">
                <button class="icon-btn" type="button" aria-selected="true" tabindex="-1">
                  <svg viewBox="0 0 24 24"><path d="M4.2 11.2 12 4.4l7.8 6.8M6.6 10.4V19h10.8v-8.6M10.3 19v-4.6h3.4V19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <button class="icon-btn" type="button" aria-selected="false" tabindex="-1">
                  <svg viewBox="0 0 24 24"><path d="M12.4 13.2V5.6M12.4 5.6c2.8 0 6.2 1.6 6.2 3.6 0 1.1-1.6 1.6-3.2 1.4M12.4 5.6C9.6 5.6 6.2 7.2 6.2 9.2c0 1.1 1.6 1.6 3.2 1.4M4 17.2c1.4-1 2.8-1 4.2 0s2.8 1 4.2 0 2.8-1 4.2 0 2.8 1 4.2 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                </button>
              </div>
              <h1>Today’s Weather Conditions</h1>
              <div class="top-actions"><span class="icon-btn" style="color: var(--blue)">☼</span></div>
            </header>
            <section class="now">
              <p class="kicker">Right now</p>
              <div class="hero">
                <div class="hero-icon" style="color: var(--icon)">
                  <svg viewBox="0 0 78 64" fill="none"><circle cx="39" cy="32" r="13" stroke="#ff9f0a" stroke-width="2.4"/></svg>
                </div>
                <div class="hero-temp"><span class="temp-value">85</span><span class="degree">°</span></div>
              </div>
              <p class="feels">Feels like 91°</p>
              <h2 class="condition">Sunny</h2>
              <p class="place">Home</p>
            </section>
            <section class="details">
              <div class="panel-switch">
                <button type="button" aria-selected="false">Conditions</button>
                <button type="button" aria-selected="true">Almanac</button>
              </div>
              <div class="conditions-card">
                <div class="almanac-range">
                  <div class="almanac-track"></div>
                  <div class="almanac-marks"><span>49°</span><span>66°</span><span>87°</span><span>103°</span></div>
                </div>
                <p class="almanac-group">Records</p>
                <div class="sky-grid">
                  ${tile(loIcon, "Low (1964)", "", "49°")}
                  ${tile(hiIcon, "High (1988)", "", "103°")}
                </div>
                <p class="almanac-group">Normals</p>
                <p class="almanac-group-sub">1991–2020</p>
                <div class="sky-grid">
                  ${tile(loIcon, "Low", "", "66°")}
                  ${tile(hiIcon, "High", "", "87°")}
                </div>
                <p class="almanac-group">Sky</p>
                <div class="sky-grid">
                  ${tile(sunUp, "Sunrise", "", "6:19 AM")}
                  ${tile(sunDown, "Sunset", "", "8:04 PM")}
                  ${tile(moonSvg(5), "Moon", "Waxing Crescent", "5%")}
                  ${tile(moonSvg(100), "Next full", "in 12 days", "Aug 28")}
                </div>
                <p class="almanac-foot">Climate station · 8/16</p>
                <p class="almanac-foot">Data courtesy RCC-ACIS</p>
              </div>
            </section>
          </div>
          <p class="caption">${caption}</p>
        </div>`;
      }

      document.getElementById("gallery").innerHTML =
        phone("light", "", "Light · tile layout") +
        phone("dark", "proposed", "Dark · B type + tiles");

      document.getElementById("phases").innerHTML = [5, 25, 33, 50, 66, 75, 100]
        .map((pct) => `<div class="phase">${moonSvg(pct)}${pct}%</div>`)
        .join("");
    </script>
  </body>
</html>
