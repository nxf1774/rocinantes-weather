<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hourly · sticky day labels mock</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      }
      .mock-bar {
        position: sticky;
        top: 0;
        z-index: 5;
        padding: 8px 14px;
        background: #2c2c2e;
        color: #f2f2f7;
        font-size: 13px;
        line-height: 1.35;
      }
      .mock-bar strong { font-weight: 700; }
      .mock-bar span { color: #aeaeb2; }
      iframe {
        display: block;
        width: 100%;
        height: calc(100vh - 42px);
        height: calc(100dvh - 42px);
        border: 0;
        background: #1c1c1e;
      }
    </style>
  </head>
  <body>
    <div class="mock-bar">
      <strong>Mock: bumping day labels.</strong>
      <span> TODAY stays left. The next day name scrolls in from the right and pushes it off.</span>
    </div>
    <iframe id="app" title="Live weather page" src="../public/index.html"></iframe>
    <script>
      const CSS = `
        .hourly-wrap {
          position: relative;
          overflow: hidden;
        }
        .hourly-days {
          height: 18px;
          align-items: center;
        }
        .hourly-days span {
          display: flex;
          align-items: center;
          height: 18px;
          padding: 0 8px 0 6px;
          line-height: 18px;
          border-left: none;
        }
        .hourly-day-pin {
          position: absolute;
          left: 0;
          top: 8px;
          z-index: 3;
          display: flex;
          align-items: center;
          height: 18px;
          padding: 0 10px 0 6px;
          color: var(--text);
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 0.35px;
          line-height: 18px;
          white-space: nowrap;
          pointer-events: none;
          will-change: transform;
          background: linear-gradient(
            90deg,
            var(--bg-elevated) 0%,
            var(--bg-elevated) 65%,
            color-mix(in srgb, var(--bg-elevated) 0%, transparent) 100%
          );
        }
        .hourly-day-pin.today { color: var(--orange); }
        .hourly-days span.is-current {
          color: transparent;
        }
      `;

      function dayBoxes(scroll) {
        return [...scroll.querySelectorAll(".hourly-days > span")].map((el) => {
          const box = el.getBoundingClientRect();
          return {
            el,
            label: (el.dataset.label || el.textContent || "").trim(),
            left: box.left,
            right: box.right,
          };
        });
      }

      function updatePin(scroll, pin) {
        const days = dayBoxes(scroll);
        if (!days.length) return;
        const edge = scroll.getBoundingClientRect().left;
        let current = days[0];
        let next = days[1] || null;
        for (let i = 0; i < days.length; i += 1) {
          if (days[i].left <= edge + 2 && days[i].right > edge + 16) {
            current = days[i];
            next = days[i + 1] || null;
          }
        }
        days.forEach((day) => day.el.classList.toggle("is-current", day.el === current.el));
        pin.textContent = current.label;
        pin.classList.toggle("today", current.label === "TODAY");
        const wrap = scroll.closest(".hourly-wrap");
        const row = scroll.querySelector(".hourly-days");
        if (wrap && row) {
          pin.style.top = `${row.getBoundingClientRect().top - wrap.getBoundingClientRect().top}px`;
        }
        pin.style.transform = "translateX(0)";
        if (!next) return;
        const overlap = pin.offsetWidth - (next.left - edge);
        if (overlap > 0) pin.style.transform = `translateX(${-overlap}px)`;
      }

      function ensurePin(doc) {
        const scroll = doc.getElementById("hourly-scroll");
        if (!scroll) return;
        let wrap = scroll.closest(".hourly-wrap");
        if (!wrap) {
          wrap = doc.createElement("div");
          wrap.className = "hourly-wrap";
          scroll.parentNode.insertBefore(wrap, scroll);
          wrap.appendChild(scroll);
        }
        let pin = wrap.querySelector(".hourly-day-pin");
        if (!pin) {
          pin = doc.createElement("div");
          pin.className = "hourly-day-pin";
          wrap.insertBefore(pin, scroll);
          scroll.addEventListener(
            "scroll",
            () => {
              window.requestAnimationFrame(() => updatePin(scroll, pin));
            },
            { passive: true }
          );
        }
        scroll.querySelectorAll(".hourly-days > span").forEach((span) => {
          if (!span.dataset.label) span.dataset.label = span.textContent.trim();
        });
        updatePin(scroll, pin);
      }

      function install(win) {
        const doc = win.document;
        if (!doc.getElementById("hourly-sticky-css")) {
          const style = doc.createElement("style");
          style.id = "hourly-sticky-css";
          style.textContent = CSS;
          doc.head.appendChild(style);
        }
        const original = win.renderHourlyTemps;
        if (typeof original === "function" && !original.__stickyWrapped) {
          const wrapped = function (meteo) {
            original.call(this, meteo);
            ensurePin(doc);
          };
          wrapped.__stickyWrapped = true;
          win.renderHourlyTemps = wrapped;
        }
        ensurePin(doc);
      }

      const frame = document.getElementById("app");
      frame.addEventListener("load", () => {
        const win = frame.contentWindow;
        install(win);
        setTimeout(() => install(win), 600);
        setTimeout(() => install(win), 2200);
      });
    </script>
  </body>
</html>
